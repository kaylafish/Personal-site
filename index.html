<script>
  // Set theme before first paint to avoid a light→dark flash.
  (function() {
    try {
      var saved = localStorage.getItem('mf_theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'cream');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'cream');
    }
    // The home and project pages are always dark; flag them before first paint too.
    if (!/^\/(fieldhockey|highlights)\/?$/.test(location.pathname)) {
      document.documentElement.classList.add('glass-home');
    }
  })();
  // Appearance of the legacy field-hockey pages (/fieldhockey, /highlights).
  // styles.css only carries the "playful" system now.
  // theme:  "cream" (light) | "ink" (dark) — overridden by the user's toggle
  window.SITE = {
    system: "playful",
    theme: "cream",
    fontScale: 0.9,
    primaryAccent: "#166534",
    fieldHockeyAccent: "#0f4c5c"
  };
</script>
